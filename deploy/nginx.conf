server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Resolved per request so the site starts and keeps serving while the API is down.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Storybook is not public. Authentication lives here, not in the host proxy, so the container port cannot bypass it.
  # A missing password file answers 403.
  location ^~ /storybook {
    auth_basic "Storybook";
    auth_basic_user_file /etc/nginx/storybook.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ =404;
  }

  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ =404;
  }
}
