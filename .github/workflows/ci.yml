name: CI and release images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @ui-kit/web exec playwright install --with-deps chromium firefox webkit
      # Root-path build with Storybook, as served in production.
      - run: pnpm --filter @ui-kit/web test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-evidence
          path: apps/web/test-results
          retention-days: 7

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # requirements.txt pins what the image runs; the dev extra adds the test and lint tools.
      - run: python -m pip install --requirement apps/api/requirements.txt --editable "apps/api[dev]"
      - run: python -m ruff check apps/api
      - run: python -m ruff format --check apps/api
      - run: python -m pytest tests
        working-directory: apps/api

  deploy-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck deploy/*.sh
      - run: docker compose --env-file deploy/.env.example --file deploy/compose.yaml config --quiet
        env:
          PEN_IMAGE_TAG: ci

  images:
    needs: [web, api, deploy-files]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      SOURCE: https://github.com/${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images
        run: |
          for name in web api; do
            docker build --file "deploy/$name.Dockerfile" --tag "$REGISTRY-$name:ci" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$COMMIT" .
          done
      - name: Start the production stack and smoke test it
        run: |
          printf 'ci:%s\n' "$(openssl passwd -apr1 ci-only)" > "$RUNNER_TEMP/storybook.htpasswd"
          cat > "$RUNNER_TEMP/pen.env" <<ENV
          POSTGRES_PASSWORD=ci-only
          PEN_ORIGIN=http://127.0.0.1:8088
          PEN_HTTP_PORT=8088
          PEN_STORYBOOK_HTPASSWD=$RUNNER_TEMP/storybook.htpasswd
          ENV
          PEN_IMAGE_TAG=ci docker compose --env-file "$RUNNER_TEMP/pen.env" --file deploy/compose.yaml up --detach --wait
          STORYBOOK_AUTH=ci:ci-only deploy/smoke.sh http://127.0.0.1:8088
      - name: Show container logs
        if: failure()
        run: docker compose --project-name pen logs --no-color
      # The server deploys a commit only when both of these tags exist, so they are pushed last.
      - name: Publish the verified images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          for name in web api; do
            docker tag "$REGISTRY-$name:ci" "$REGISTRY-$name:sha-$COMMIT"
            docker push --quiet "$REGISTRY-$name:sha-$COMMIT"
          done
