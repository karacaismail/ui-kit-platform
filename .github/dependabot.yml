version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    # pydantic pins an exact pydantic-core; bumping it alone breaks the install (PR #4).
    ignore:
      - dependency-name: pydantic-core
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    # Node and Python majors are project decisions (README requirements), not routine updates.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
