services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ui_kit
      POSTGRES_USER: ui_kit
      POSTGRES_PASSWORD: ui_kit
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ui_kit -d ui_kit"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ui_kit_postgres:/var/lib/postgresql/data
      - ./apps/api/sql/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

volumes:
  ui_kit_postgres:
